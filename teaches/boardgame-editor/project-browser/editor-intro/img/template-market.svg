<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
  <rect width="780" height="480" rx="10" fill="#1a1a1a"/>
